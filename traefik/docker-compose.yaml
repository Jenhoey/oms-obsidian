version: '3'

services:
  # Traefik service
  traefik:
    image: traefik:v2.9
    container_name: traefik
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS (optional if using SSL)
      - "8080:8080" # Traefik Dashboard
    networks:
      - webtraefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik.yml:/etc/traefik/traefik.yml
      - ./logs:/logs
    command:
      - --api.insecure=true
      - --log.level=DEBUG
      - --log.filePath=/logs/traefik.log
      - --providers.docker=true
      - --entrypoints.web.address=:80
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3" 
networks:
  webtraefik:
    name: webtraefik
    driver: bridge
