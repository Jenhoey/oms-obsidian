server:
  verbosity: 1
  interface: 0.0.0.0
  port: 53
  
  access-control: 0.0.0.0/0 allow
  do-not-query-localhost: no

  # Define a local zone for all `.lan` domains
  local-zone: "lan." static
  local-data: "grafana.lan. IN A 127.0.0.1"
  local-data-ptr: "127.0.0.1 traefik.lan."

forward-zone:
  name: "."
  forward-addr: 1.1.1.1    # Cloudflare DNS
  forward-addr: 8.8.8.8    # Google DNS
